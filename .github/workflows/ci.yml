name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: No private files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo is exported from a private working repo. The export is
      # allowlist-driven, so this should never fire — it exists to catch a
      # hand-edit or a bad merge, where the allowlist offers no protection.
      - name: Check for files that must never be published
        run: |
          fail=0
          for p in plans protocols captures tools .claude .venv jadx-out; do
            if [ -e "$p" ]; then
              echo "::error::$p must not exist in the public repo"
              fail=1
            fi
          done
          for f in $(git ls-files '*.apk' '*.btsnoop' 'btsnoop_hci.log*' \
                                  'local.properties' '*.jks' '*.keystore'); do
            echo "::error file=$f::$f must not be committed"
            fail=1
          done
          exit $fail

  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
