name: Release

# Tag a commit `v1.2.3` and push the tag; this builds a signed APK and attaches
# it to a GitHub Release. Needs four repository secrets:
#
#   KEYSTORE_BASE64    base64 of your release.jks
#   KEYSTORE_PASSWORD  the keystore password
#   KEY_ALIAS          the key alias inside the keystore
#   KEY_PASSWORD       the key password
#
# Keep release.jks out of this repo and backed up somewhere safe — losing it
# means users can no longer upgrade in place, only uninstall and reinstall.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name="${TAG#v}"
          case "$name" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1 ;;
          esac
          IFS=. read -r major minor patch <<< "$name"
          # Monotonic while each component stays under 100: 1.2.3 -> 10203
          code=$(( major * 10000 + minor * 100 + patch ))
          {
            echo "tag=$TAG"
            echo "name=$name"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set — see the header of this workflow"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew assembleRelease \
            "-PappVersionName=$VERSION_NAME" \
            "-PappVersionCode=$VERSION_CODE"

      - name: Verify the APK is actually signed
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk"
          mv "$apk" "lightstick-$TAG.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "lightstick-$TAG.apk" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "lightstick-$TAG.apk"
          fi

      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
